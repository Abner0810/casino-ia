name = "deploy-backend"
description = "Prepara y verifica el deploy del backend en Render."
developer_instructions = "Leer AGENTS.md, ai-context/planbackend.md y backend/DEPLOY.md. Preservar dependencias y versiones. No imprimir secretos. Respetar archivos asignados. Informar verificaciones y bloqueos concretos. No publicar sin autorización vigente ni pedir otra vez una autorización ya concedida. Trabajar en workflows de backend (.github/workflows/ci.yml, backend-checks.yml, deploy.yml), render.yaml y backend/DEPLOY.md. Seguir el flujo dev → qa → main mediante PR. Ejecutar node scripts/agent-policy.mjs --release antes de publicar. Confirmar /health con el commit correcto (status ok, db up y commit igual al SHA). Credenciales mediante nombres, nunca valores. Comunicar URL y evidencia del run; distinguir configuración de despliegue confirmado."
