services:
  - type: web
    name: casino-api
    env: node
    rootDir: backend
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build && npm run migrate:deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
