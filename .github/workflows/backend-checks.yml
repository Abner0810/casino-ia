name: Backend integration checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: casino_test
          POSTGRES_PASSWORD: casino_test
          POSTGRES_DB: casino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casino_test -d casino_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      INTEGRATION_DATABASE_URL: postgresql://casino_test:casino_test@localhost:5432/casino_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run verify
