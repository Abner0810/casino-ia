name: Backend checks
on:
  push:
    branches: [dev, qa]
  pull_request:
    branches: [dev, qa, main]
  workflow_call:
permissions:
  contents: read
jobs:
  integration:
    needs: test
    uses: ./.github/workflows/backend-checks.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: casino_test
          POSTGRES_PASSWORD: casino_test
          POSTGRES_DB: casino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casino_test -d casino_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://casino_test:casino_test@localhost:5432/casino_test
      DATABASE_URL: postgresql://casino_test:casino_test@localhost:5432/casino_test
      DIRECT_URL: postgresql://casino_test:casino_test@localhost:5432/casino_test
      JWT_ACCESS_SECRET: ci-access-secret-de-pruebas-1234567890-abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-de-pruebas-1234567890-abcdef
      CORS_ORIGINS: http://localhost:3001
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Migrate isolated test database
        run: npm run migrate:deploy
      - name: E2E tests against PostgreSQL
        run: npm run test:e2e
