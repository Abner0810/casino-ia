name: Deploy backend to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-production
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/backend/polish-render'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy tested commit and verify readiness
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_URL: https://casino-ia-9llp.onrender.com
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node backend/scripts/deploy-hook.mjs
