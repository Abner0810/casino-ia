# Deploy automático a Render cuando se pushea a main.
# Primero corre la misma batería de tests (gate); solo si pasan,
# se dispara el deploy vía la API de Render.
#
# Secrets requeridos en GitHub (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY    → Render: Account Settings → API Keys
#   RENDER_SERVICE_ID → ID del servicio (svc-xxxx...), en la página del servicio
name: Deploy a Producción (Render)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar el deploy manual desde la pestaña Actions

jobs:
  integration:
    uses: ./.github/workflows/backend-checks.yml
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci_dummy
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci_dummy
      JWT_ACCESS_SECRET: ci-access-secret-de-pruebas-1234567890-abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-de-pruebas-1234567890-abcdef
      CORS_ORIGINS: "*"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Tests de lógica (Plinko + Blackjack)
        run: npm run test:logic

      - name: Smoke test de la API
        run: node tests/smoke.http.mjs

  deploy:
    needs: [test, integration] # publica solo con lógica e integración aprobadas
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::warning::Faltan los secrets RENDER_API_KEY / RENDER_SERVICE_ID. Configúralos en GitHub → Settings → Secrets and variables → Actions. El deploy NO se disparó."
            exit 0
          fi
          echo "Disparando deploy del servicio $RENDER_SERVICE_ID..."
          curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?api_key=${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clear_cache": false}'
          echo ""
          echo "✅ Deploy solicitado a Render. Síguelo en el dashboard de Render → Deploys."
