# Combinar explícitamente con docker-compose.yml; no afecta la imagen publicada.
services:
  api:
    build:
      target: development
    environment:
      NODE_ENV: development
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      # Este overlay habilita Checkout local y requiere ambas claves Stripe
      # de prueba en backend/.env; las cadenas vacías no pasan la validación.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-bob}
      STRIPE_CHECKOUT_BASE_URL: http://127.0.0.1:5173
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./src:/app/src:ro
    read_only: false
